name: Deploy Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: slides-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git to use HTTPS with token
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check the lockfile
        run: npm test && npm run check:lockfile
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the service-course deck type scale
        run: npm run check:type-scale
      - name: Build all decks
        run: npm run packages:build-base
      - name: Deploy to Cloudflare Pages
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
