name: Site freshness
on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * *" # daily 21:23 UTC = 05:23 Beijing

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Check the deploy pipeline is shipping
        run: node scripts/check-deploy-freshness.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the theme pin is current
        run: node scripts/check-theme-pin.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
